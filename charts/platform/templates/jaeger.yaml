apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: jaeger }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        {{- include "platform.labels" . | nindent 8 }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: jaeger
          image: {{ .Values.jaeger.image }}
          env:
            - { name: MEMORY_MAX_TRACES, value: {{ .Values.jaeger.maxTraces | quote }} }
          ports:
            - { name: ui, containerPort: 16686 }
            - { name: otlp-http, containerPort: 4318 }
          readinessProbe:
            httpGet: { path: /, port: 14269 }
          resources: {{- toYaml .Values.jaeger.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: jaeger }
  ports: [{ name: otlp-http, port: 4318 }]
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: jaeger }
  ports: [{ name: ui, port: 16686, nodePort: {{ .Values.jaeger.nodePort }} }]
