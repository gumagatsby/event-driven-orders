{{- range .Values.databases }}
{{- $secret := lookup "v1" "Secret" $.Release.Namespace (printf "%s-credentials" .name) }}
---
# The password is generated once and kept on upgrade; it never appears in values or git.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}-credentials
  labels: {{- include "platform.labels" $ | nindent 4 }}
type: Opaque
data:
  username: {{ .user | b64enc }}
  password: {{ if $secret }}{{ index $secret.data "password" }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels: {{- include "platform.labels" $ | nindent 4 }}
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: {{ .name }} }
  ports: [{ name: postgres, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .name }}
  labels: {{- include "platform.labels" $ | nindent 4 }}
spec:
  serviceName: {{ .name }}
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: {{ .name }} }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
        {{- include "platform.labels" $ | nindent 8 }}
    spec:
      securityContext: { runAsUser: 70, runAsGroup: 70, fsGroup: 70, runAsNonRoot: true }
      containers:
        - name: postgres
          image: {{ $.Values.postgres.image }}
          env:
            - { name: POSTGRES_DB, value: {{ .database }} }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ .name }}-credentials, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .name }}-credentials, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ name: postgres, containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .user | quote }}, "-d", {{ .database | quote }}] }
            periodSeconds: 5
          resources: {{- toYaml $.Values.postgres.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ $.Values.postgres.storage }} } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .name }}
  labels: {{- include "platform.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: {{ .name }} }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: {{ .client }} }
      ports: [{ port: 5432 }]
{{- end }}
