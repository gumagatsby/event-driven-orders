# Local development. The same images run in Kubernetes via the Helm charts.
name: orders-platform

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none

services:
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["127.0.0.1:9094:9094"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 5s
      retries: 20

  orders-db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: orders, POSTGRES_PASSWORD: orders, POSTGRES_DB: orders }
    ports: ["127.0.0.1:5433:5432"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "orders"], interval: 3s, retries: 20 }

  inventory-db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: inventory, POSTGRES_PASSWORD: inventory, POSTGRES_DB: inventory }
    ports: ["127.0.0.1:5434:5432"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "inventory"], interval: 3s, retries: 20 }

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["127.0.0.1:16687:16686"]

  inventory:
    build: { context: ., dockerfile: inventory/Dockerfile }
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: inventory
      DB_URL: jdbc:postgresql://inventory-db:5432/inventory
      KAFKA_BOOTSTRAP: kafka:9092
    ports: ["127.0.0.1:8083:8080", "127.0.0.1:9091:9090"]
    depends_on:
      kafka: { condition: service_healthy }
      inventory-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      retries: 30

  orders:
    build: { context: ., dockerfile: orders/Dockerfile }
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: orders
      DATABASE_URL: postgres://orders:orders@orders-db:5432/orders
      KAFKA_BROKERS: kafka:9092
      INVENTORY_GRPC: inventory:9090
    ports: ["127.0.0.1:3001:3000"]
    depends_on:
      orders-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""]
      interval: 5s
      retries: 30
